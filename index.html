<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1022">
<title>Bot</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23161a3a'/%3E%3Cpath d='M90 30l-45 76 45 27 45-27z' fill='%23a5b4fc'/%3E%3Cpath d='M90 142l-45-27 45 37 45-37z' fill='%236366f1'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#12142b;--mute:#6b7090;--line:#e3e5f2;--up:#0f9d6b;--down:#d6334f;--accent:#4f46e5;
  box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1022;--card:#161a3a;--ink:#eef0ff;--mute:#9aa0c8;--line:#262b57;--up:#2dd4a0;--down:#ff6b86;--accent:#a5b4fc}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
.sub{color:var(--mute);font-size:13px}
.tag{font-size:13.5px;font-weight:600;color:var(--accent);margin:2px 0 4px}
.price{font-size:clamp(40px,12vw,56px);font-weight:700;letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.chg{font-size:17px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
button{font:inherit;cursor:pointer}
.tab{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:14px}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible,.refresh:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:100%;height:220px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:12.5px}
.trend{font-size:15px;line-height:1.5}
.refresh{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:15px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.bar.on .dot{background:var(--up)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.act{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.act.start{background:var(--up);border-color:var(--up);color:#fff}
.act.stop{background:var(--down);border-color:var(--down);color:#fff}
.act:disabled{opacity:.45;cursor:default}
#msg{color:var(--mute);font-size:13.5px;margin-top:10px;min-height:18px}
.wallet{margin-top:0}
.bal{font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-1px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--mute);margin-top:8px;word-break:break-all}
.hist{margin-top:16px}
.hist h2{font-size:16px;margin:0 0 10px;font-weight:600;text-align:left}
.empty{color:var(--mute);font-size:14px;padding:18px 0;text-align:center}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.tx:first-child{border-top:0}
.tx small{display:block;color:var(--mute);font-size:12px}
[hidden]{display:none!important}
.pay input{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.pay .acts{margin-top:12px}
.tx a{color:var(--accent);font-size:12px}
#err{color:var(--down);font-size:13.5px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Bot - Designed by NM</h1><div class="tag">fully automatic crypto machine</div><div class="sub" id="upd">Loading…</div></div>
    <button class="refresh" id="rf">Refresh</button>
  </header>
  <div class="card wallet">
    <div class="sub">Wallet balance</div>
    <div class="bal" id="bal">—</div>
    <div class="sub" id="balUsd">&nbsp;</div>
    <div class="addr" id="addr"></div>
  </div>

  <div class="bar" id="bar"><span class="dot"></span><span id="state">Stopped</span></div>
  <div class="acts">
    <button class="act start" id="bStart">Start</button>
    <button class="act stop" id="bStop" disabled>Stop</button>
    <button class="act" id="bDep">Deposit</button>
    <button class="act" id="bWd">Withdraw</button>
  </div>
  <div id="msg" role="status"></div>
  <div class="card pay" id="pay" hidden>
    <div class="sub" id="payTitle"></div>
    <input id="payAmt" inputmode="decimal" placeholder="Amount in ETH" autocomplete="off">
    <input id="payTo" placeholder="Destination address (0x…)" autocomplete="off" autocapitalize="off" spellcheck="false" hidden>
    <div class="acts">
      <button class="act start" id="payOk">Confirm</button>
      <button class="act" id="payNo">Cancel</button>
    </div>
  </div>

  <div class="card hist">
    <h2>Transaction history</h2>
    <div id="txList" class="txl"><div class="empty">No transactions yet.</div></div>
  </div>

  <div class="card trend" id="trend">Trend will appear once data loads.</div>

  <div class="stats">
    <div class="stat"><span>24h high</span><b id="hi">—</b></div>
    <div class="stat"><span>24h low</span><b id="lo">—</b></div>
    <div class="stat"><span>24h change</span><b id="rc">—</b></div>
    <div class="stat"><span>Market cap</span><b id="mc">—</b></div>
  </div>
  <div id="err" role="status"></div>
</main>
<script>
(function(){
  var API="https://api.coingecko.com/api/v3";
  var days=1, timer=null;
  var WALLET="0x003d18d76eCdf8a014880D0E09a26bD306B2c967";
  var RPCS=["https://ethereum-rpc.publicnode.com","https://eth.llamarpc.com","https://cloudflare-eth.com"];
  var ethUsd=null, ethBal=null;
  var $=function(i){return document.getElementById(i)};
  var usd=function(n,d){return "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d})};
  var pct=function(n){return (n>=0?"+":"")+n.toFixed(2)+"%"};

  function get(path){
    return fetch(API+path).then(function(r){
      if(!r.ok) throw new Error(r.status===429?"Rate limit reached. Retrying shortly.":"Server error "+r.status);
      return r.json();
    });
  }

  function sma(vals,n){var s=0;for(var i=vals.length-n;i<vals.length;i++)s+=vals[i];return s/n}

  function trendText(vals,change){
    var first=vals[0],last=vals[vals.length-1];
    var n=Math.max(5,Math.round(vals.length/5));
    var avg=sma(vals,Math.min(n,vals.length));
    var dir=change>1?"Uptrend":change<-1?"Downtrend":"Sideways";
    var pos=last>avg?"above":"below";
    return "<b class='"+(change>=0?"up":"down")+"'>"+dir+"</b> over the last 24 hours ("+pct(change)+"). Price is "+pos+" its recent average of "+usd(avg)+".";
  }

  function loadChart(){
    return get("/coins/ethereum/market_chart?vs_currency=usd&days="+days).then(function(d){
      var pts=d.prices;
      if(!pts||pts.length<10) throw new Error("Not enough chart data.");
      var vals=pts.map(function(p){return p[1]});
      var first=vals[0],last=vals[vals.length-1];
      var change=(last-first)/first*100;
      $("hi").textContent=usd(Math.max.apply(null,vals));
      $("lo").textContent=usd(Math.min.apply(null,vals));
      var rc=$("rc");rc.textContent=pct(change);rc.className=change>=0?"up":"down";
      $("trend").innerHTML=trendText(vals,change);
    });
  }

  function loadPrice(){
    return get("/coins/markets?vs_currency=usd&ids=ethereum").then(function(a){
      var e=a[0];
      ethUsd=e.current_price;
      showBal();
      $("mc").textContent="$"+(e.market_cap/1e9).toFixed(1)+"B";
    });
  }

  function rpc(i){
    if(i>=RPCS.length) return Promise.reject(new Error("Could not read the wallet balance. Retrying shortly."));
    return fetch(RPCS[i],{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_getBalance",params:[WALLET.toLowerCase(),"latest"]})})
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(j){if(!j||!j.result)throw 0;return j.result})
      .catch(function(){return rpc(i+1)});
  }

  function showBal(){
    if(ethBal==null)return;
    $("bal").textContent=ethBal.toLocaleString("en-US",{minimumFractionDigits:4,maximumFractionDigits:4})+" ETH";
    $("balUsd").textContent=ethUsd!=null?"≈ "+usd(ethBal*ethUsd):"";
  }

  function loadWallet(){
    return rpc(0).then(function(h){ethBal=parseInt(h,16)/1e18;showBal()})
      .catch(function(e){$("balUsd").textContent=e.message});
  }

  function refresh(){
    loadWallet();
    $("err").textContent="";
    Promise.all([loadPrice(),loadChart()]).then(function(){
      $("upd").textContent="Updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    }).catch(function(e){
      $("err").textContent=(e&&e.message)||"Could not load data. Check your connection and tap Refresh.";
      $("upd").textContent="Update failed";
    });
  }

  $("rf").addEventListener("click",refresh);

  var HKEY="bot_tx_v1", txs=[];
  try{txs=JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){txs=[]}
  function saveTx(){try{localStorage.setItem(HKEY,JSON.stringify(txs.slice(0,50)))}catch(e){}}
  function renderTx(){
    var box=$("txList");box.innerHTML="";
    if(!txs.length){var e=document.createElement("div");e.className="empty";e.textContent="No transactions yet.";box.appendChild(e);return}
    txs.forEach(function(t){
      var row=document.createElement("div");row.className="tx";
      var l=document.createElement("div");l.textContent=t.type;
      var sm=document.createElement("small");sm.textContent=t.time+" · "+t.status;l.appendChild(sm);
      var r=document.createElement("div");r.style.textAlign="right";
      var b=document.createElement("b");b.textContent=t.amount+" ETH";r.appendChild(b);
      if(/^0x[0-9a-fA-F]{64}$/.test(t.hash||"")){
        var a=document.createElement("a");a.href="https://etherscan.io/tx/"+t.hash;a.target="_blank";a.rel="noopener";a.textContent="View";
        var w=document.createElement("div");w.appendChild(a);r.appendChild(w);
      }
      row.appendChild(l);row.appendChild(r);box.appendChild(row);
    });
  }
  renderTx();

  var mode=null, SHORT=WALLET.slice(0,6)+"…"+WALLET.slice(-4);
  function openPay(m){
    mode=m;$("pay").hidden=false;
    $("payTitle").textContent=m==="deposit"?"Deposit ETH to the bot wallet "+SHORT:"Withdraw ETH from the bot wallet "+SHORT;
    $("payTo").hidden=m!=="withdraw";
    $("payAmt").value="";$("payTo").value="";$("msg").textContent="";
  }
  function closePay(){$("pay").hidden=true;mode=null}
  function toWei(str){
    if(!/^\d+(\.\d{1,18})?$/.test(str))return null;
    var p=str.split("."),f=(p[1]||"").padEnd(18,"0");
    var w=BigInt(p[0])*BigInt("1000000000000000000")+BigInt(f);
    return w>BigInt(0)?w:null;
  }
  function watch(t){
    var n=0;
    var iv=setInterval(function(){
      n++;
      window.ethereum.request({method:"eth_getTransactionReceipt",params:[t.hash]}).then(function(r){
        if(r){clearInterval(iv);t.status=r.status==="0x1"?"Confirmed":"Failed";saveTx();renderTx();loadWallet()}
      }).catch(function(){});
      if(n>120)clearInterval(iv);
    },5000);
  }
  async function submitPay(){
    var prov=window.ethereum, msg=$("msg");
    if(!prov){msg.textContent="Open this page in the browser inside your wallet app (MetaMask, Trust Wallet, etc.) to deposit or withdraw.";return}
    var wei=toWei($("payAmt").value.trim());
    if(wei===null){msg.textContent="Enter a valid amount in ETH.";return}
    var to=WALLET;
    if(mode==="withdraw"){
      to=$("payTo").value.trim();
      if(!/^0x[a-fA-F0-9]{40}$/.test(to)){msg.textContent="Enter a valid destination address (0x, then 40 characters).";return}
    }
    $("payOk").disabled=true;
    try{
      var accts=await prov.request({method:"eth_requestAccounts"});
      var from=accts[0];
      if(mode==="withdraw"&&from.toLowerCase()!==WALLET.toLowerCase()){
        msg.textContent="To withdraw, select the bot wallet "+SHORT+" in your wallet app.";return;
      }
      var cid=await prov.request({method:"eth_chainId"});
      if(cid!=="0x1")await prov.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x1"}]});
      var hash=await prov.request({method:"eth_sendTransaction",params:[{from:from,to:to,value:"0x"+wei.toString(16)}]});
      var t={type:mode==="deposit"?"Deposit":"Withdraw",amount:$("payAmt").value.trim(),time:new Date().toLocaleString([],{dateStyle:"medium",timeStyle:"short"}),status:"Pending",hash:String(hash)};
      txs.unshift(t);saveTx();renderTx();watch(t);
      closePay();msg.textContent="Transaction submitted. It will show as Confirmed below.";
    }catch(e){
      msg.textContent=(e&&e.code===4001)?"Cancelled in your wallet.":((e&&e.message)||"Transaction failed.");
    }finally{$("payOk").disabled=false}
  }
  $("payOk").addEventListener("click",submitPay);
  $("payNo").addEventListener("click",closePay);
  if(window.ethereum)txs.forEach(function(t){if(t.status==="Pending"&&/^0x[0-9a-fA-F]{64}$/.test(t.hash||""))watch(t)});

  var running=false;
  function setRun(v){
    running=v;
    $("bar").className="bar"+(v?" on":"");
    $("state").textContent=v?"Running":"Stopped";
    $("bStart").disabled=v;$("bStop").disabled=!v;
    $("msg").textContent=v?"Bot started.":"Bot stopped.";
  }
  $("bStart").addEventListener("click",function(){setRun(true)});
  $("bStop").addEventListener("click",function(){setRun(false)});
  $("bDep").addEventListener("click",function(){openPay("deposit")});
  $("bWd").addEventListener("click",function(){openPay("withdraw")});

  $("addr").textContent=SHORT;
  setInterval(function(){if(!document.hidden)loadWallet()},20000);
  refresh();
  timer=setInterval(function(){if(!document.hidden)refresh()},60000);
})();
</script>
</body>
</html>
